version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: [dependencies]

  # Keeps the SHA-pinned actions in .github/workflows current. Without this,
  # pinning by digest means never receiving upstream security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: [dependencies, github-actions]
